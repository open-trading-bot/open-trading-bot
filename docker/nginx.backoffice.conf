server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Caddy is the only client of this container. It sets X-Forwarded-For to
    # the real client IP. Use that address as $remote_addr.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location / {
        try_files $uri $uri/ /index.html;

        # CSP_DIRECTIVES in server/src/server.ts without reCAPTCHA and WebSocket:
        # the backoffice uses neither. It calls the API on the same origin.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Same-origin API for the backoffice. The server applies
    # BACKOFFICE_ALLOWED_IPS to /api/backoffice. The API sets its own headers.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, not append: the server must never see a client-supplied value.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
