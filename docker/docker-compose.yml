services:
  # TLS termination. The only service with published ports.
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # Caddy reads DOMAIN, BACKOFFICE_DOMAIN and BACKOFFICE_ALLOWED_IPS.
    env_file: .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client
      - backoffice
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: server
    env_file: .env.production
    volumes:
      - server-data:/app/data
      - server-logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: client
    depends_on:
      - server
    restart: unless-stopped

  backoffice:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: backoffice
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
  server-logs:
  caddy-data:
  caddy-config:
